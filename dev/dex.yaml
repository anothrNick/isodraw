# Dex for local development: a real OIDC provider with fixed test users, so the
# API runs the same login code it uses against Cognito. Nothing here is secret.
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: isodraw-local
    name: IsoDraw (local)
    secret: local-secret
    redirectURIs:
      # Vite dev server (npm run dev) and the built app (npm run dev:full).
      - http://localhost:5190/auth/callback
      - http://localhost:8080/auth/callback

enablePasswordDB: true

# Both users sign in with the password "password".
staticPasswords:
  - email: dev@isodraw.local
    hash: "$2a$10$v9VFPCWJQSsSt.5uwM.DMuFHt7.c2aga2qo.037ObkUu/Yc3Xr75W"
    username: dev
    userID: 0b4f5c2e-6a51-4c1e-9d0e-6f1d5b6b6a01
  - email: alex@isodraw.local
    hash: "$2a$10$v9VFPCWJQSsSt.5uwM.DMuFHt7.c2aga2qo.037ObkUu/Yc3Xr75W"
    username: alex
    userID: 0b4f5c2e-6a51-4c1e-9d0e-6f1d5b6b6a02
