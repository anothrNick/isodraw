name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Library, demo and web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test --workspaces --if-present
      - name: Build the library and the web app
        run: npm run build
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (builds the demo)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/isodraw/playwright-report
          retention-days: 14

  api:
    name: API
    runs-on: ubuntu-latest
    env:
      # Database and sign-in tests fail instead of skipping when the services are missing.
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Start Postgres and Dex
        run: docker compose up -d --wait
      - run: go vet ./...
        working-directory: api
      - run: go test ./...
        working-directory: api

  deploy-demo:
    name: Deploy the demo
    # Every push to main that passes the library, demo and web app checks.
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the demo
        run: npm run build:demo -w isodraw
      - name: Publish to the gh-pages branch
        run: >
          npx gh-pages -d packages/isodraw/demo-dist
          -m "Deploy demo from ${GITHUB_SHA::7}"
          -u "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
